[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "valanga"
version = "0.3.0"
description = "Shared types and utilities for evaluation"
requires-python = ">=3.14"
dependencies = []
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name="Victor Gabillon", email="victorgabillon@gmail.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]


[project.optional-dependencies]
test = [
    # Testing dependencies
    "pytest==9.1.1",
    "coverage==7.17.0",
    "pytest-cov==7.1.0"
]

lint = [
  "ruff==0.17.3",
  "pylint==4.1.3",
]

typecheck = [
  "mypy==2.4.0",
  "pyright[nodejs]==1.1.414",
]


dev = [
    # Development dependencies (includes test)
    "tox==4.67.2",
    "types-PyYAML==6.0.12.20260906",

    # Linting & formatting
    "ruff==0.17.3",
    "pylint==4.1.3",
    "black==26.10.1",

    # Type checking
    "mypy==2.4.0",
    "pyright[nodejs]==1.1.414",

    # Building & publishing
    "build==1.6.1",
    "twine==7.0.0",

    # Documentation
    "sphinx==9.2.0",
    "sphinx-rtd-theme==3.1.0",
    "sphinx-autodoc-typehints==3.17.3",

    # Pre-commit hooks
    "pre-commit==4.7.0"

]





[tool.pytest.ini_options]
addopts = "--cov=valanga"
testpaths = [
    "tests"
]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
warn_unreachable = true
no_implicit_reexport = true

# Disallow untyped definitions and calls
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true

# None and optional handling
no_implicit_optional = true

# Configuring warnings
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_redundant_casts = true

# Misc things
strict_equality = true
warn_unused_configs = true

[tool.ruff]
line-length = 88
target-version = "py314"

# Enable import sorting (alphabetical + group order)
lint.select = ["I", "F", "E", "B", "TC","UP","SIM",
 "C4", "RUF", "PL","RET","ARG","ANN", "PERF", "TRY","LOG","RSE",
 "D","ISC","PIE","ERA","TD"]  # I = imports, F = pyflakes, E = pycodestyle, TCH = type-checking, B = black

# Allow auto-fixing for imports and type-checking imports
lint.fixable = ["I", "TC", "F401", "RUF","PL","D"]

# Ignore rules you don't care about
lint.ignore = [ "E501",
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

# Optional: add your first-party package to extend the known group
[tool.ruff.lint.per-file-ignores]
# If needed, can add file-specific ignores

# Public dataclasses and protocols are inspected with get_type_hints at runtime.
[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["typing", "valanga"]
runtime-evaluated-base-classes = ["typing.Protocol"]
runtime-evaluated-decorators = ["dataclasses.dataclass"]

[tool.black]
line-length = 88
target-version = ['py314']

[tool.pylint]
py-version = "3.14"

[tool.pylint.format]
max-line-length = 88

#[tool.pylint.messages_control]
disable = [
    "C0301",
    "unnecessary-ellipsis",
    "W0511"
    ]


[tool.pylint.typecheck]
# Optional: same as init-hook in .pylintrc
init-hook = "import sys; sys.path.append('.')"

[tool.pylint.design]
min-public-methods = 1

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingImports = true
reportUnusedImport = true
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportPrivateImportUsage = false


#################### TOX ####################

[tool.tox]
min_version = "4.67.2"
env_list = ["py314", "lint", "typecheck", "build"]
isolated_build = true

[tool.tox.env_run_base]
base_python = ["python3.14"]

[tool.tox.env.py314]
description = "Run tests"
extras = ["test"]
commands = [["pytest", "{posargs}"]]

[tool.tox.env.lint]
description = "ruff + pylint (fast, no package install)"
package = "skip"
deps = ["ruff==0.17.3", "pylint==4.1.3"]
set_env = { PYTHONPATH = "{toxinidir}/src" }
commands = [
  ["python", "-m", "ruff", "check", "src"],
  ["python", "-m", "ruff", "format", "--check", "src", "tests"],
  ["python", "-m", "pylint", "src/valanga"],
]

[tool.tox.env.typecheck]
description = "mypy + pyright (fast, no package install)"
package = "skip"
deps = ["mypy==2.4.0", "pyright[nodejs]==1.1.414"]
set_env = { MYPYPATH = "{toxinidir}/src" }
commands = [
  ["python", "-m", "mypy", "--config-file", "pyproject.toml", "src/valanga", "tests/typing/protocols.py"],
  ["python", "-m", "pyright", "src/valanga", "tests/typing/protocols.py"],
  ["python", "tools/check_type_contracts.py"],
]


[tool.tox.env.build]
deps = ["build==1.6.1"]
commands = [["python", "-m", "build"]]



#################### END TOX ####################
